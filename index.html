<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1"
    />
    <title>Healyum ⚡</title>

    <!-- Telegram WebApp JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      :root {
        --bg: #020617;
        --bg-card: #020617;
        --accent-up: #22c55e;
        --accent-down: #f97316;
        --text-main: #e5e7eb;
        --text-muted: #9ca3af;
        --border-subtle: #111827;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Helvetica Neue", Arial, sans-serif;
        background: radial-gradient(circle at top, #020617 0, #020617 40%, #020617 100%);
        color: var(--text-main);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: radial-gradient(circle at top left, #111827, #020617);
        border-radius: 24px;
        padding: 16px 18px 20px;
        box-shadow: 0 24px 50px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(148, 163, 184, 0.18);
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }

      .title {
        font-size: 20px;
        font-weight: 700;
        margin: 0;
      }

      .subtitle {
        margin: 4px 0 0;
        font-size: 13px;
        color: var(--text-muted);
      }

      .badge {
        padding: 4px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
        border: 1px solid var(--border-subtle);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .badge-open {
        border-color: rgba(34, 197, 94, 0.4);
        color: #bbf7d0;
        background: rgba(22, 163, 74, 0.18);
      }

      .badge-locked {
        border-color: rgba(234, 179, 8, 0.7);
        color: #facc15;
        background: rgba(234, 179, 8, 0.12);
      }

      .badge-resolved {
        border-color: rgba(148, 163, 184, 0.5);
        color: #cbd5f5;
        background: rgba(15, 23, 42, 0.7);
      }

      /* asset + prezzi + link */
      .asset-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 10px;
        margin-bottom: 10px;
      }

      .asset-symbol {
        font-size: 13px;
        color: var(--text-muted);
      }

      .asset-prices {
        font-size: 12px;
        color: var(--text-main);
      }

      .asset-prices span.muted {
        color: var(--text-muted);
      }

      .wallet-link {
        font-size: 12px;
        color: #38bdf8;
        text-decoration: none;
      }

      /* stats row */
      .stats-row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .stat-box {
        flex: 1;
        background: #020617;
        border-radius: 14px;
        padding: 8px 10px;
      }

      .label-up {
        font-size: 11px;
        color: #4ade80;
        margin-bottom: 2px;
      }

      .label-down {
        font-size: 11px;
        color: #fb7185;
        margin-bottom: 2px;
      }

      .label-muted {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 2px;
      }

      .value {
        font-size: 18px;
        font-weight: 700;
      }

      .value-small {
        font-size: 12px;
        color: var(--text-main);
      }

      .section {
        margin-top: 14px;
      }

      .section-title {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 6px;
      }

      .odds-bar {
        position: relative;
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: #111827;
      }

      .odds-up {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        background: #16a34a;
        transition: width 0.2s ease-out;
      }

      .odds-down {
        position: absolute;
        right: 0;
        top: 0;
        bottom: 0;
        background: #f97316;
        transition: width 0.2s ease-out;
      }

      .chart-container {
        background: #020617;
        border-radius: 18px;
        padding: 8px 8px 4px;
      }

      #votesChart {
        width: 100%;
        max-height: 170px;
      }

      .chart-empty {
        font-size: 12px;
        color: var(--text-muted);
        padding: 16px;
        text-align: center;
      }

      .range-row {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 8px;
      }

      .range-btn {
        border-radius: 999px;
        border: none;
        padding: 5px 12px;
        font-size: 11px;
        background: #020617;
        color: var(--text-muted);
      }

      .range-btn.active {
        background: #111827;
        color: var(--text-main);
      }

      .cta-row {
        display: flex;
        gap: 12px;
        margin-top: 18px;
      }

      .btn-up,
      .btn-down {
        flex: 1;
        border: none;
        border-radius: 999px;
        padding: 10px 0;
        font-size: 15px;
        font-weight: 600;
        color: #020617;
        cursor: pointer;
        transition: transform 0.08s ease-out, box-shadow 0.08s ease-out,
          opacity 0.15s;
      }

      .btn-up {
        background: #22c55e;
        box-shadow: 0 6px 18px rgba(34, 197, 94, 0.4);
      }

      .btn-down {
        background: #fb7185;
        box-shadow: 0 6px 18px rgba(248, 113, 113, 0.35);
      }

      .btn-up:active,
      .btn-down:active {
        transform: translateY(1px) scale(0.99);
        box-shadow: none;
      }

      .btn-up:disabled,
      .btn-down:disabled {
        opacity: 0.55;
        cursor: default;
      }

      .footer-text {
        margin-top: 8px;
        font-size: 11px;
        color: var(--text-muted);
        text-align: center;
      }

      .error {
        margin-top: 8px;
        font-size: 11px;
        color: #fca5a5;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <!-- HEADER -->
      <div class="header">
        <div>
          <h1 class="title">Healyum ⚡</h1>
          <p class="subtitle">
            Predict Tesla: will today close UP or DOWN?
          </p>
        </div>
        <div id="statusBadge" class="badge badge-open">OPEN</div>
      </div>

      <!-- ASSET + PREZZI + LINK WALLET -->
      <div class="asset-row">
        <div>
          <div class="asset-symbol" id="assetSymbol">TSLAX – -</div>
          <div class="asset-prices">
            <span class="muted">Open:</span>
            <span id="priceOpen">-</span>
            <span class="muted">· Now:</span>
            <span id="priceNow">-</span>
          </div>
        </div>
        <a
          id="walletLink"
          href="#"
          target="_blank"
          rel="noreferrer"
          class="wallet-link"
          style="display: none"
        >
          View in wallet
        </a>
      </div>

      <!-- STATS: UP / DOWN / POOL -->
      <div class="stats-row">
        <div class="stat-box">
          <div class="label-up">UP</div>
          <div class="value" id="pctUp">-</div>
        </div>
        <div class="stat-box">
          <div class="label-down">DOWN</div>
          <div class="value" id="pctDown">-</div>
        </div>
        <div class="stat-box">
          <div class="label-muted">Pool</div>
          <div class="value-small">
            Votes: <span id="totalVotes">-</span>
          </div>
          <div class="value-small">
            Volume: <span id="volumeUsdc">-</span> USDC
          </div>
        </div>
      </div>

      <!-- MARKET ODDS BAR -->
      <div class="section">
        <div class="section-title">Market odds</div>
        <div class="odds-bar">
          <div class="odds-up" id="oddsUp" style="width: 50%"></div>
          <div class="odds-down" id="oddsDown" style="width: 50%"></div>
        </div>
      </div>

      <!-- GRAFICO -->
      <div class="section">
        <div class="section-title">Votes over time (UP %)</div>
        <div class="chart-container">
          <canvas id="votesChart" height="160"></canvas>
          <div class="chart-empty" id="chartEmpty" style="display: none">
            Not enough data yet – place the first votes!
          </div>
        </div>
        <div class="range-row">
          <button class="range-btn active" data-range="1h">1H</button>
          <button class="range-btn" data-range="6h">6H</button>
          <button class="range-btn" data-range="all">ALL</button>
        </div>
      </div>

      <!-- CTA -->
      <div class="cta-row">
        <button id="btnUp" class="btn-up">UP 🚀</button>
        <button id="btnDown" class="btn-down">DOWN 📉</button>
      </div>

      <div class="footer-text" id="footerText">
        Loading market…
      </div>
      <div class="footer-text" id="openedText">Opened –</div>

      <div id="error" class="error" style="display: none"></div>
    </div>

    <script>
      // Telegram WebApp
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();

      // Backend Render
      const API_BASE = "https://healyum-bot.onrender.com";

      // Elementi DOM
      const els = {
        statusBadge: document.getElementById("statusBadge"),
        assetSymbol: document.getElementById("assetSymbol"),
        priceOpen: document.getElementById("priceOpen"),
        priceNow: document.getElementById("priceNow"),
        walletLink: document.getElementById("walletLink"),
        pctUp: document.getElementById("pctUp"),
        pctDown: document.getElementById("pctDown"),
        totalVotes: document.getElementById("totalVotes"),
        volumeUsdc: document.getElementById("volumeUsdc"),
        oddsUp: document.getElementById("oddsUp"),
        oddsDown: document.getElementById("oddsDown"),
        footerText: document.getElementById("footerText"),
        openedText: document.getElementById("openedText"),
        error: document.getElementById("error"),
        btnUp: document.getElementById("btnUp"),
        btnDown: document.getElementById("btnDown"),
        chartEmpty: document.getElementById("chartEmpty"),
      };

      let currentMarketId = null;
      let currentRange = "1h";
      let marketStatus = "OPEN";

      // Chart.js setup
      let chart = null;

      function formatPct(num) {
        return (Math.round(num * 1000) / 10).toFixed(1) + "%";
      }

      function formatTime(ts) {
        const d = new Date(ts);
        return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      }

      function formatOpenedAgo(openedAt) {
        if (!openedAt) return "Opened –";
        const opened = new Date(openedAt);
        const now = new Date();
        const diffMs = now - opened;
        const minutes = Math.max(0, Math.floor(diffMs / 60000));
        const hours = Math.floor(minutes / 60);
        const mins = minutes % 60;
        let s = "Opened ";
        if (hours > 0) s += hours + "h ";
        s += mins + "m ago";
        return s;
      }

      function setBadge(status) {
        const s = (status || "OPEN").toUpperCase();
        marketStatus = s;
        els.statusBadge.className = "badge";
        if (s === "OPEN") {
          els.statusBadge.classList.add("badge-open");
          els.statusBadge.textContent = "OPEN";
        } else if (s === "LOCKED") {
          els.statusBadge.classList.add("badge-locked");
          els.statusBadge.textContent = "LOCKED";
        } else {
          els.statusBadge.classList.add("badge-resolved");
          els.statusBadge.textContent = "RESOLVED";
        }
        const enabled = s === "OPEN";
        els.btnUp.disabled = !enabled;
        els.btnDown.disabled = !enabled;
      }

      function initChart() {
        const ctx = document.getElementById("votesChart").getContext("2d");
        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "UP %",
                data: [],
                borderColor: "#22c55e",
                backgroundColor: "rgba(34,197,94,0.15)",
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.35,
                fill: true,
              },
              {
                label: "DOWN %",
                data: [],
                borderColor: "#f97316",
                backgroundColor: "rgba(249,115,22,0.08)",
                borderWidth: 1.5,
                pointRadius: 0,
                tension: 0.35,
                fill: false,
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                mode: "index",
                intersect: false,
                callbacks: {
                  label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}%`,
                },
              },
            },
            scales: {
              x: {
                ticks: { color: "#9ca3af", font: { size: 10 }, maxTicksLimit: 5 },
                grid: { display: false },
              },
              y: {
                min: 0,
                max: 100,
                ticks: {
                  stepSize: 25,
                  color: "#6b7280",
                  font: { size: 9 },
                  callback: (v) => v + "%",
                },
                grid: { color: "rgba(31,41,55,0.6)" },
              },
            },
          },
        });
      }

      async function loadMarketSummary() {
        els.error.style.display = "none";
        try {
          const res = await fetch(`${API_BASE}/api/markets/latest`);
          if (!res.ok) {
            throw new Error(`HTTP ${res.status} ${res.statusText}`);
          }
          const data = await res.json();
          currentMarketId = data.id;

          // header asset
          els.assetSymbol.textContent = `${data.asset || "TSLAX"} – ${data.date}`;
          els.priceOpen.textContent =
            data.open_price != null ? data.open_price.toFixed(2) : "-";
          els.priceNow.textContent =
            data.current_price != null ? data.current_price.toFixed(2) : "-";

          if (data.wallet_url) {
            els.walletLink.href = data.wallet_url;
            els.walletLink.style.display = "inline";
          } else {
            els.walletLink.style.display = "none";
          }

          const pctUp = data.pct_up ?? 0.5;
          const pctDown = data.pct_down ?? 0.5;

          els.pctUp.textContent = formatPct(pctUp);
          els.pctDown.textContent = formatPct(pctDown);

          els.totalVotes.textContent = data.total_votes ?? 0;
          els.volumeUsdc.textContent =
            data.volume_usdc != null ? data.volume_usdc.toFixed(0) : "-";

          els.oddsUp.style.width = pctUp * 100 + "%";
          els.oddsDown.style.width = pctDown * 100 + "%";

          setBadge(data.status || "OPEN");
          els.footerText.textContent =
            data.status === "OPEN"
              ? "Choose UP or DOWN to join today's pool."
              : "Market is not accepting new bets.";
          els.openedText.textContent = formatOpenedAgo(data.opened_at);
        } catch (e) {
          els.error.style.display = "block";
          els.error.textContent = "Error loading market: " + e.message;
          els.footerText.textContent = "Live data unavailable.";
        }
      }

      async function loadMarketHistory(range) {
        if (!currentMarketId) return;
        els.error.style.display = "none";
        try {
          const res = await fetch(
            `${API_BASE}/api/markets/${encodeURIComponent(
              currentMarketId
            )}/history?range=${range}`
          );
          if (!res.ok) {
            throw new Error(`HTTP ${res.status} ${res.statusText}`);
          }
          const data = await res.json();
          const history = data.history || [];

          if (!history.length) {
            els.chartEmpty.style.display = "block";
            chart.data.labels = [];
            chart.data.datasets[0].data = [];
            chart.data.datasets[1].data = [];
            chart.update();
            return;
          } else {
            els.chartEmpty.style.display = "none";
          }

          const labels = history.map((p) => formatTime(p.ts));
          const upSeries = history.map((p) =>
            Math.round((p.pct_up || 0) * 1000) / 10
          );
          const downSeries = history.map((p) =>
            Math.round((p.pct_down || 0) * 1000) / 10
          );

          chart.data.labels = labels;
          chart.data.datasets[0].data = upSeries;
          chart.data.datasets[1].data = downSeries;
          chart.update("none");
        } catch (e) {
          els.error.style.display = "block";
          els.error.textContent = "Error loading history: " + e.message;
        }
      }

      function sendChoice(rawSide) {
        if (marketStatus !== "OPEN") return;
        const payload = {
          type: "BET",
          side: rawSide, // TESLA_UP / TESLA_DOWN
          stake: 1,
        };
        tg.sendData(JSON.stringify(payload));
        tg.close();
      }

      // Eventi bottoni range
      document.querySelectorAll(".range-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const range = btn.getAttribute("data-range");
          currentRange = range;
          document
            .querySelectorAll(".range-btn")
            .forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          loadMarketHistory(range);
        });
      });

      // Eventi bottoni UP/DOWN
      els.btnUp.addEventListener("click", () => sendChoice("TESLA_UP"));
      els.btnDown.addEventListener("click", () => sendChoice("TESLA_DOWN"));

      // Init
      initChart();
      (async () => {
        await loadMarketSummary();
        await loadMarketHistory(currentRange);
        // polling ogni 10s
        setInterval(async () => {
          await loadMarketSummary();
          await loadMarketHistory(currentRange);
        }, 10000);
      })();
    </script>
  </body>
</html>
